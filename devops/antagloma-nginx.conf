server {
    listen 80;
    server_name api.antagloma.kaizora.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.antagloma.kaizora.id;

    root /var/www/antagloma-backend/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/api.antagloma.kaizora.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.antagloma.kaizora.id/privkey.pem;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
